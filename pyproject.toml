[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hg_viz"
version = "0.1.0"
description = "Graphviz visualisation and data-flow introspection for running hgraph graphs"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
dependencies = ["hgraph>=0.8"]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
hg_viz = ["viewer.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
